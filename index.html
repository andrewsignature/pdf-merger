    <style>
        :root {
            --primary-color: #1c1c4e;
            --bg-color: #fdfdfd;
            --text-color: #1a1a1a;
            --border-color: #eee;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 700px;
            border: 1px solid var(--border-color);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
        }

        h1 {
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .upload-area {
            text-align: center;
            border: 2px dashed var(--primary-color);
            padding: 2.5rem;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-area.dragover {
            background-color: #fff5f5;
            border-style: solid;
        }

        #file-list {
            margin-bottom: 2rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            padding: 10px 15px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            cursor: grab;
        }

        .file-item:active { cursor: grabbing; }

        .handle {
            margin-right: 15px;
            color: #ccc;
            font-size: 20px;
        }

        .file-info {
            flex-grow: 1;
            font-size: 0.9rem;
        }

        .page-input {
            width: 120px;
            padding: 5px;
            border: 1px solid #ccc;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .remove-btn {
            color: #ff4444;
            cursor: pointer;
            margin-left: 15px;
            font-weight: bold;
        }

        button#merge-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button#merge-btn:disabled {
            background-color: #ccc;
        }

        .hint {
            font-size: 0.75rem;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }

        #status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>

    </div>

    <div class="upload-area" id="drop-zone">
        <p>Drag and drop or click to add files</p>
        <input type="file" id="pdf-inputs" accept="application/pdf" multiple style="display:none">
    </div>

    <div id="file-list"></div>

    <button id="merge-btn">Merge files</button>
    <p class="hint">Drag to reorder. E.g., "1-3, 5" to select specific pages.</p>
    
    <div id="status"></div>
</div>

<script>
    const { PDFDocument } = PDFLib;
    let filesData = [];

    const fileInput = document.getElementById('pdf-inputs');
    const fileListElement = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    const status = document.getElementById('status');
    const dropZone = document.getElementById('drop-zone');

    // Drag and Drop files handling
    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });
    });

    dropZone.addEventListener('drop', (e) => {
        const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
        handleFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(Array.from(e.target.files));
        fileInput.value = '';
    });

    function handleFiles(files) {
        for (const file of files) {
            const id = Math.random().toString(36).substr(2, 9);
            filesData.push({ id, file });
            addFileToUI(file, id);
        }
    }

    // Sorting reorder
    new Sortable(fileListElement, {
        animation: 150,
        handle: '.handle'
    });

    function addFileToUI(file, id) {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.dataset.id = id;
        div.innerHTML = `
            <div class="handle">☰</div>
            <div class="file-info">
                <strong>${file.name}</strong><br>
                <small>Pages : </small>
                <input type="text" class="page-input" placeholder="All (ex: 1, 3-5)" data-id="${id}">
            </div>
            <div class="remove-btn" onclick="removeFile('${id}')">✕</div>
        `;
        fileListElement.appendChild(div);
    }

    window.removeFile = (id) => {
        const el = document.querySelector(`[data-id="${id}"]`);
        el.remove();
        filesData = filesData.filter(f => f.id !== id);
    };

    function parsePages(rangeStr, maxPages) {
        if (!rangeStr || !rangeStr.trim()) return Array.from({length: maxPages}, (_, i) => i);
        const pages = new Set();
        const parts = rangeStr.split(',');
        for (const part of parts) {
            if (part.includes('-')) {
                const [start, end] = part.split('-').map(n => parseInt(n.trim()) - 1);
                for (let i = start; i <= end; i++) {
                    if (i >= 0 && i < maxPages) pages.add(i);
                }
            } else {
                const n = parseInt(part.trim()) - 1;
                if (n >= 0 && n < maxPages) pages.add(n);
            }
        }
        return Array.from(pages);
    }

    mergeBtn.addEventListener('click', async () => {
        const items = Array.from(fileListElement.querySelectorAll('.file-item'));
        if (items.length === 0) return;

        status.innerText = "Fusion en cours...";
        mergeBtn.disabled = true;

        try {
            const mergedPdf = await PDFDocument.create();

            for (const item of items) {
                const id = item.dataset.id;
                const fileObj = filesData.find(f => f.id === id);
                const pageInput = item.querySelector('.page-input').value;

                const arrayBuffer = await fileObj.file.arrayBuffer();
                const pdf = await PDFDocument.load(arrayBuffer);
                const pageCount = pdf.getPageCount();
                
                const pagesToCopy = parsePages(pageInput, pageCount);
                const copiedPages = await mergedPdf.copyPages(pdf, pagesToCopy);
                copiedPages.forEach(page => mergedPdf.addPage(page));
            }

            // Logique de nommage par date
           const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const filename = `pdf-merger_${year}-${month}-${day}.pdf`;

            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            
            status.innerText = "✅ Done!";
        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error during processing.";
        } finally {
            mergeBtn.disabled = false;
        }
    });
</script>
